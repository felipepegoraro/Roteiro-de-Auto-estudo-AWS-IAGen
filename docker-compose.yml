services:
  floci:
    image: floci/floci:latest
    ports: ["4566:4566"]
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_SERVICES_BEDROCK_RUNTIME_BACKEND: proxy
      FLOCI_SERVICES_BEDROCK_RUNTIME_PROXY_URL: http://ollama:11434/v1
      # ponytail: 1b porque a máquina tem < 8 GB livres; troque por llama3.2 se sobrar RAM
      FLOCI_SERVICES_BEDROCK_RUNTIME_PROXY_DEFAULT_MODEL: ${MODELO_LOCAL:-llama3.2:1b}
      # Etapas 2 e 5: IAM_ENFORCEMENT=true docker compose up -d
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: ${IAM_ENFORCEMENT:-false}
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock # necessário para o Lambda
    depends_on: [ollama]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama
volumes:
  ollama:
